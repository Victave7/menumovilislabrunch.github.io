<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner TV vertical</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }
  #stage {
    position: fixed;
    top: 0;
    left: 0;
    transform-origin: top left;
  }
  video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover; /* cover: llena todo; contain: muestra el video entero con barras negras */
  }
</style>
</head>
<body>
  <div id="stage">
    <video src="/video/loopi.mp4" autoplay muted loop playsinline preload="auto"></video>
  </div>

  <script>
    /*
      Modo vertical automático:
      - Si la pantalla ya está en vertical (TV girada o ajustada en el sistema), no gira nada.
      - Si la pantalla está en horizontal, gira la página 90° para verla en vertical.
      Opciones por URL:
        banner.html?rot=90    -> fuerza giro a la derecha
        banner.html?rot=270   -> fuerza giro a la izquierda
        banner.html?rot=0     -> sin giro
        banner.html?fit=contain -> muestra el video entero con barras negras
    */
    const params = new URLSearchParams(location.search);
    const stage = document.getElementById('stage');
    const v = document.querySelector('video');

    if (params.get('fit') === 'contain') v.style.objectFit = 'contain';

    function layout() {
      const W = window.innerWidth, H = window.innerHeight;
      let rot = params.has('rot') ? parseInt(params.get('rot'), 10) : (W > H ? 90 : 0);

      if (rot === 90) {
        stage.style.width = H + 'px';
        stage.style.height = W + 'px';
        stage.style.left = W + 'px';
        stage.style.top = '0px';
        stage.style.transform = 'rotate(90deg)';
      } else if (rot === 90) {
        stage.style.width = H + 'px';
        stage.style.height = W + 'px';
        stage.style.left = '0px';
        stage.style.top = H + 'px';
        stage.style.transform = 'rotate(-90deg)';
      } else {
        stage.style.width = W + 'px';
        stage.style.height = H + 'px';
        stage.style.left = '0px';
        stage.style.top = '0px';
        stage.style.transform = 'none';
      }
    }
    layout();
    window.addEventListener('resize', layout);

    // Asegura que el video siga reproduciéndose siempre
    v.play().catch(() => {});
    v.addEventListener('pause', () => v.play().catch(() => {}));
    v.addEventListener('ended', () => { v.currentTime = 0; v.play(); });

    // Pantalla completa al hacer clic o pulsar F
    const fs = () => document.documentElement.requestFullscreen?.();
    document.addEventListener('click', fs);
    document.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'f') fs(); });
  </script>
</body>
</html>

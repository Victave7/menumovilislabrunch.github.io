<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner TV dia/noche</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }
  #stage {
    position: fixed;
    top: 0;
    left: 0;
    transform-origin: top left;
  }
  video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover; /* cover: llena todo; contain: muestra el video entero con barras negras */
  }
</style>
</head>
<body>
  <div id="stage">
    <video autoplay muted loop playsinline preload="auto"></video>
  </div>

  <script>
    /* ====== CONFIGURACIÓN ====== */
    const VIDEO_DIA   = 'videos/dia.mp4';    // se reproduce de día (sin "/" al principio)
    const VIDEO_NOCHE = 'videos/noche.mp4';  // se reproduce de noche (sin "/" al principio)
    const HORA_INICIO_DIA   = 7;   // el video de día empieza a las 07:00
    const HORA_INICIO_NOCHE = 20;  // el video de noche empieza a las 20:00
    const ROTACION_POR_DEFECTO = 270; // 0, 90 o 270
    /* =========================== */

    /*
      Opciones por URL (sirven para probar):
        banner.html?modo=dia      -> fuerza el video de día
        banner.html?modo=noche    -> fuerza el video de noche
        banner.html?rot=0         -> sin giro (si el video ya viene girado)
        banner.html?rot=90 / 270  -> giro a un lado u otro
        banner.html?fit=contain   -> muestra el video entero con barras negras
      Se pueden combinar: banner.html?rot=0&modo=noche
    */
    const params = new URLSearchParams(location.search);
    const stage = document.getElementById('stage');
    const v = document.querySelector('video');

    if (params.get('fit') === 'contain') v.style.objectFit = 'contain';

    /* ---- Rotación (la dirección ?rot= manda; si no, lo guardado con el mando; si no, el valor por defecto) ---- */
    function rotGuardada() {
      try {
        const r = localStorage.getItem('rot');
        return r === null ? null : parseInt(r, 10);
      } catch (e) { return null; }
    }
    function rotActual() {
      if (params.has('rot')) return parseInt(params.get('rot'), 10);
      const g = rotGuardada();
      return g === null ? ROTACION_POR_DEFECTO : g;
    }
    function cambiarRotacion() { // 0 -> 90 -> 270 -> 0
      const r = rotActual();
      const sig = r === 0 ? 90 : r === 90 ? 270 : 0;
      try { localStorage.setItem('rot', String(sig)); } catch (e) {}
      layout();
      avisar('Giro: ' + sig + '°' + (params.has('rot') ? ' (la dirección ?rot= tiene prioridad)' : ''));
    }

    function layout() {
      const W = window.innerWidth, H = window.innerHeight;
      const rot = rotActual();

      if (rot === 90) {
        stage.style.width = H + 'px';
        stage.style.height = W + 'px';
        stage.style.left = W + 'px';
        stage.style.top = '0px';
        stage.style.transform = 'rotate(90deg)';
      } else if (rot === 270) {
        stage.style.width = H + 'px';
        stage.style.height = W + 'px';
        stage.style.left = '0px';
        stage.style.top = H + 'px';
        stage.style.transform = 'rotate(-90deg)';
      } else {
        stage.style.width = W + 'px';
        stage.style.height = H + 'px';
        stage.style.left = '0px';
        stage.style.top = '0px';
        stage.style.transform = 'none';
      }
    }
    layout();
    window.addEventListener('resize', layout);

    /* ---- Día / noche ---- */
    function modoActual() {
      const forzado = params.get('modo') || guardado();
      if (forzado === 'dia' || forzado === 'noche') return forzado;

      const h = new Date().getHours() + new Date().getMinutes() / 60;
      const esDia = HORA_INICIO_DIA < HORA_INICIO_NOCHE
        ? (h >= HORA_INICIO_DIA && h < HORA_INICIO_NOCHE)
        : (h >= HORA_INICIO_DIA || h < HORA_INICIO_NOCHE);
      return esDia ? 'dia' : 'noche';
    }

    let modoReproduciendo = null;
    function actualizarVideo() {
      const modo = modoActual();
      if (modo === modoReproduciendo) return; // no tocar nada si no cambia
      modoReproduciendo = modo;
      v.src = modo === 'dia' ? VIDEO_DIA : VIDEO_NOCHE;
      v.load();
      v.play().catch(() => {});
    }
    actualizarVideo();
    setInterval(actualizarVideo, 30 * 1000); // comprueba cada 30 s

    /* ---- Elección manual (se recuerda aunque apagues la TV) ---- */
    function guardado() {
      try { return localStorage.getItem('modoManual'); } catch (e) { return null; }
    }
    function guardar(modo) {
      try {
        if (modo) localStorage.setItem('modoManual', modo);
        else localStorage.removeItem('modoManual');
      } catch (e) {}
    }

    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);' +
      'background:rgba(0,0,0,.7);color:#fff;font:bold 28px sans-serif;padding:12px 28px;' +
      'border-radius:12px;opacity:0;transition:opacity .3s;z-index:10;pointer-events:none';
    document.body.appendChild(toast);
    let toastTimer;
    function avisar(texto) {
      toast.textContent = texto;
      toast.style.opacity = 1;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.style.opacity = 0; }, 2000);
    }

    function elegir(modo) { // 'dia', 'noche' o null (automático)
      guardar(modo);
      actualizarVideo();
      avisar(modo === 'dia' ? 'Modo DÍA' : modo === 'noche' ? 'Modo NOCHE' : 'Modo AUTOMÁTICO');
    }

    /*
      Mando del Fire TV:  izquierda = día, derecha = noche, arriba/abajo = automático
      Teclado:            D = día, N = noche, A = automático
    */
    document.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'arrowleft'  || k === 'd') elegir('dia');
      if (k === 'arrowright' || k === 'n') elegir('noche');
      if (k === 'arrowup' || k === 'arrowdown' || k === 'a') elegir(null);
    });

    /* ---- Mantener siempre en reproducción ---- */
    v.addEventListener('pause', () => v.play().catch(() => {}));
    v.addEventListener('ended', () => { v.currentTime = 0; v.play(); });

    /* ---- Si el video falla, lo dice en pantalla y reintenta ---- */
    v.addEventListener('error', () => {
      const c = v.error ? v.error.code : '?';
      const motivo = { 1: 'cancelado', 2: 'error de red', 3: 'no se pudo decodificar', 4: 'no se encuentra o formato no compatible' }[c] || 'desconocido';
      avisar('No carga ' + v.getAttribute('src') + ' (' + motivo + ')');
      setTimeout(() => { v.load(); v.play().catch(() => {}); }, 10000);
    });

    /* ---- Botón central (Seleccionar) del mando: cambia día → noche → automático ---- */
    let ultimoCambio = 0;
    function ciclar() {
      const ahora = Date.now();
      if (ahora - ultimoCambio < 500) return; // evita dobles pulsaciones
      ultimoCambio = ahora;
      const actual = params.get('modo') || guardado();
      elegir(actual === 'dia' ? 'noche' : actual === 'noche' ? null : 'dia');
    }
    document.addEventListener('click', ciclar);
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 23) ciclar(); // 23 = Select en Android/Fire TV
    });

    /* ---- Pantalla completa: se intenta con cualquier pulsación del mando (los navegadores lo exigen) ---- */
    function pantallaCompleta() {
      const el = document.documentElement;
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      const pedir = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (!pedir) return;
      try {
        const p = pedir.call(el);
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }
    pantallaCompleta(); // intento al cargar (algunos navegadores de TV sí lo permiten)
    document.addEventListener('click', pantallaCompleta, true);
    document.addEventListener('keydown', pantallaCompleta, true);
    document.addEventListener('touchstart', pantallaCompleta, true);

    /* ---- Cambiar el giro desde el mando: botón Menú (☰), Play/Pausa, o tecla R ---- */
    let ultimoGiro = 0;
    document.addEventListener('keydown', e => {
      const esGiro = e.keyCode === 82 || e.keyCode === 179 || e.key === 'ContextMenu' ||
                     e.key === 'MediaPlayPause' || e.key.toLowerCase() === 'r';
      if (!esGiro) return;
      const ahora = Date.now();
      if (ahora - ultimoGiro < 500) return;
      ultimoGiro = ahora;
      cambiarRotacion();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reproductor TV dia/noche</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  #stage {
    position: fixed;
    top: 0;
    left: 0;
    transform-origin: top left;
    background: #000;
  }
  video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover; /* cover: llena todo; contain: muestra el video entero con barras negras */
  }

  /* ---- Menú tipo reproductor ---- */
  #menu {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    background: rgba(0, 0, 0, .70);
    color: #fff;
    transition: opacity .3s;
  }
  #menu.oculto { opacity: 0; pointer-events: none; }
  #menu h1 { margin: 0; font-size: 56px; }
  #estado { font-size: 30px; opacity: .9; min-height: 40px; text-align: center; padding: 0 40px; }
  .fila { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; padding: 0 30px; }
  button {
    font-size: 36px;
    padding: 24px 46px;
    border-radius: 18px;
    border: 4px solid transparent;
    background: #2b2b2b;
    color: #fff;
    cursor: pointer;
  }
  button.principal { background: #c62828; }
  button:focus {
    outline: none;
    border-color: #ffb300;
    background: #4a4a4a;
    transform: scale(1.06);
  }
  button.principal:focus { background: #e53935; }
  #ayuda { font-size: 22px; opacity: .6; text-align: center; padding: 0 40px; }
</style>
</head>
<body>
  <div id="stage">
    <!-- SIN atributo loop: el bucle lo hacemos nosotros (más fiable en Fire TV / Silk) -->
    <video muted autoplay playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>

    <div id="menu">
      <h1>Banner TV</h1>
      <div id="estado"></div>
      <div class="fila">
        <button id="b-auto" class="principal" data-act="auto">&#9654; Reproducir (automático)</button>
      </div>
      <div class="fila">
        <button id="b-dia" data-act="dia">&#9728; Día</button>
        <button id="b-noche" data-act="noche">&#9790; Noche</button>
        <button id="b-rot" data-act="rot">Giro</button>
      </div>
      <div id="ayuda">Flechas del mando: moverte &nbsp;·&nbsp; Seleccionar: elegir &nbsp;·&nbsp; Con el video en marcha, cualquier botón vuelve a este menú</div>
    </div>
  </div>

  <script>
    /* ====== CONFIGURACIÓN ====== */
    const VIDEO_DIA   = 'videos/dia.mp4';    // se reproduce de día
    const VIDEO_NOCHE = 'videos/noche.mp4';  // se reproduce de noche
    const HORA_INICIO_DIA   = 7;   // el video de día empieza a las 07:00
    const HORA_INICIO_NOCHE = 20;  // el video de noche empieza a las 20:00
    const ROTACION_POR_DEFECTO = 0; // 0 si el video ya viene girado. Si no, 90 o 270 (también se cambia desde el menú)
    const SEGUNDOS_MENU = 8;        // el menú se oculta solo pasado este tiempo
    const MODO_KIOSCO = true;       // true: arranca solo al abrir la página, sin pulsar nada, y no se detiene
    const RECARGAR_CADA_HORAS = 4;  // recarga la página cada X horas para liberar memoria (0 = nunca)
    /* =========================== */

    /*
      Opciones por URL (opcionales):
        ?modo=dia | ?modo=noche   -> fuerza un video
        ?rot=0 | 90 | 270         -> fuerza el giro por CSS
        ?fit=contain              -> muestra el video entero con barras negras
    */
    const params = new URLSearchParams(location.search);
    const stage = document.getElementById('stage');
    const v = document.querySelector('video');
    const menu = document.getElementById('menu');
    const estado = document.getElementById('estado');
    const botones = Array.from(menu.querySelectorAll('button'));
    const bRot = document.getElementById('b-rot');

    v.muted = true;
    v.loop = false; // el bucle se gestiona con 'ended' + vigilante
    if (params.get('fit') === 'contain') v.style.objectFit = 'contain';

    /* ---- Almacenamiento (se recuerda al apagar la TV) ---- */
    function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function escribir(k, val) {
      try { if (val === null) localStorage.removeItem(k); else localStorage.setItem(k, val); } catch (e) {}
    }

    /* ---- Rotación por CSS (solo si el video NO viene ya girado) ---- */
    function rotActual() {
      if (params.has('rot')) return parseInt(params.get('rot'), 10);
      const g = leer('rot');
      return g === null ? ROTACION_POR_DEFECTO : parseInt(g, 10);
    }
    function layout() {
      const W = window.innerWidth, H = window.innerHeight;
      const rot = rotActual();
      if (rot === 90) {
        stage.style.width = H + 'px'; stage.style.height = W + 'px';
        stage.style.left = W + 'px';  stage.style.top = '0px';
        stage.style.transform = 'rotate(90deg)';
      } else if (rot === 270) {
        stage.style.width = H + 'px'; stage.style.height = W + 'px';
        stage.style.left = '0px';     stage.style.top = H + 'px';
        stage.style.transform = 'rotate(-90deg)';
      } else {
        stage.style.width = W + 'px'; stage.style.height = H + 'px';
        stage.style.left = '0px';     stage.style.top = '0px';
        stage.style.transform = 'none';
      }
    }
    layout();
    window.addEventListener('resize', layout);

    /* ---- Día / noche ---- */
    function modoManual() {
      const m = params.get('modo') || leer('modoManual');
      return (m === 'dia' || m === 'noche') ? m : null;
    }
    function modoActual() {
      const m = modoManual();
      if (m) return m;
      const d = new Date();
      const h = d.getHours() + d.getMinutes() / 60;
      const esDia = HORA_INICIO_DIA < HORA_INICIO_NOCHE
        ? (h >= HORA_INICIO_DIA && h < HORA_INICIO_NOCHE)
        : (h >= HORA_INICIO_DIA || h < HORA_INICIO_NOCHE);
      return esDia ? 'dia' : 'noche';
    }

    function arrancar() {
      v.muted = true;
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    }

    let modoReproduciendo = null;
    function actualizarVideo() {
      const modo = modoActual();
      if (modo !== modoReproduciendo) {
        modoReproduciendo = modo;
        v.src = modo === 'dia' ? VIDEO_DIA : VIDEO_NOCHE;
        v.load();
      }
      arrancar();
      etiquetas();
    }
    setInterval(actualizarVideo, 30 * 1000); // en automático, cambia solo a la hora

    function etiquetas() {
      const nombre = modoReproduciendo === 'dia' ? 'DÍA' : 'NOCHE';
      estado.textContent = 'Video actual: ' + nombre + (modoManual() ? ' (elegido a mano)' : ' (automático por hora)');
      bRot.textContent = 'Giro: ' + rotActual() + '°';
    }

    /* ---- Pantalla completa (necesita una pulsación del mando) ---- */
    function pantallaCompleta() {
      const el = document.documentElement;
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      const pedir = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (!pedir) return;
      try { const p = pedir.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    }
    function enPantallaCompleta() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    /* ---- Mostrar / ocultar el menú ---- */
    let jugando = false;
    let temporizador;
    function ocultarMenu() {
      menu.classList.add('oculto');
      document.body.style.cursor = 'none';
    }
    function menuOculto() { return menu.classList.contains('oculto'); }
    function programarOcultar() {
      clearTimeout(temporizador);
      if (jugando) temporizador = setTimeout(ocultarMenu, SEGUNDOS_MENU * 1000);
    }
    function mostrarMenu() {
      menu.classList.remove('oculto');
      document.body.style.cursor = 'default';
      etiquetas();
      if (!botones.includes(document.activeElement)) botones[0].focus();
      programarOcultar();
    }

    /* ---- Acciones de los botones ---- */
    function reproducir(modoElegido) { // 'dia', 'noche' o null (automático)
      escribir('modoManual', modoElegido);
      escribir('kiosco', '1'); // recuerda que ya se pulsó play: la próxima vez arranca solo
      jugando = true;
      actualizarVideo();
      ocultarMenu();
      pantallaCompleta();
    }
    function cambiarRotacion() {
      const r = rotActual();
      escribir('rot', String(r === 0 ? 90 : r === 90 ? 270 : 0));
      layout();
      etiquetas();
      programarOcultar();
    }
    botones.forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const a = b.dataset.act;
      if (a === 'auto') reproducir(null);
      else if (a === 'dia') reproducir('dia');
      else if (a === 'noche') reproducir('noche');
      else if (a === 'rot') cambiarRotacion();
    }));

    /* ---- Mando del Fire TV ---- */
    document.addEventListener('keydown', e => {
      if (menuOculto()) {            // con el video en marcha, cualquier botón abre el menú
        e.preventDefault();
        mostrarMenu();
        return;
      }
      programarOcultar();
      const k = e.key;
      const i = botones.indexOf(document.activeElement);
      if (k === 'ArrowRight' || k === 'ArrowDown') {
        e.preventDefault();
        botones[(i + 1 + botones.length) % botones.length].focus();
      } else if (k === 'ArrowLeft' || k === 'ArrowUp') {
        e.preventDefault();
        botones[(i - 1 + botones.length) % botones.length].focus();
      } else if (e.keyCode === 23) {  // 23 = botón central en Android/Fire TV
        e.preventDefault();
        (botones[i] || botones[0]).click();
      }
      // Enter normal lo gestiona el propio botón enfocado
    });
    document.addEventListener('click', () => { if (menuOculto()) mostrarMenu(); });

    // Si salen de la pantalla completa (botón Atrás), vuelve el menú
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
      document.addEventListener(ev, () => { if (!enPantallaCompleta() && jugando) mostrarMenu(); }));

    /* ====== BUCLE INFINITO / KIOSCO ====== */

    // Al terminar el video, vuelve al principio y sigue (bucle manual)
    function reiniciar() {
      try { v.currentTime = 0; } catch (e) {}
      arrancar();
    }
    v.addEventListener('ended', reiniciar);

    // Si algo lo pausa (menos el menú), lo vuelve a arrancar
    v.addEventListener('pause', () => { if (!v.ended) arrancar(); });

    // Error de carga: muestra aviso y reintenta cada 10 s
    v.addEventListener('error', () => {
      const c = v.error ? v.error.code : '?';
      const motivo = { 1: 'cancelado', 2: 'error de red', 3: 'no se pudo decodificar', 4: 'no se encuentra o formato no compatible' }[c] || 'desconocido';
      mostrarMenu();
      estado.textContent = 'No carga ' + v.getAttribute('src') + ' (' + motivo + ')';
      setTimeout(() => { v.load(); arrancar(); }, 10000);
    });

    // Que la pantalla no se apague / no salte el salvapantallas
    let bloqueo = null;
    async function pedirBloqueo() {
      try {
        if ('wakeLock' in navigator && document.visibilityState === 'visible' && !bloqueo) {
          bloqueo = await navigator.wakeLock.request('screen');
          bloqueo.addEventListener('release', () => { bloqueo = null; });
        }
      } catch (e) {}
    }
    pedirBloqueo();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { pedirBloqueo(); arrancar(); }
    });

    // Vigilante: si el video se para, se congela o termina sin reiniciarse, lo recarga
    let ultimoTiempo = -1, sinAvance = 0;
    setInterval(() => {
      const avanzo = Math.abs(v.currentTime - ultimoTiempo) > 0.01;
      ultimoTiempo = v.currentTime;
      if (v.ended) { reiniciar(); sinAvance = 0; return; }
      if (v.paused || !avanzo) sinAvance++; else sinAvance = 0;
      if (sinAvance >= 3) { // unos 9 segundos sin moverse
        sinAvance = 0;
        const t = v.currentTime;
        v.load();
        v.addEventListener('loadedmetadata', function f() {
          v.removeEventListener('loadedmetadata', f);
          try { v.currentTime = Math.min(t, (v.duration || 0) - 1); } catch (e) {}
        });
        arrancar();
      }
    }, 3000);

    // Recarga completa cada X horas (libera memoria; al volver arranca solo en modo kiosco)
    if (RECARGAR_CADA_HORAS > 0) {
      setTimeout(() => { location.reload(); }, RECARGAR_CADA_HORAS * 3600 * 1000);
    }

    /* ---- Inicio ---- */
    actualizarVideo();
    mostrarMenu();
    botones[0].focus();

    // Modo kiosco: si ya se pulsó play alguna vez (o MODO_KIOSCO), arranca solo y oculta el menú
    if (MODO_KIOSCO || leer('kiosco') === '1') {
      jugando = true;
      setTimeout(ocultarMenu, 1500);
      pantallaCompleta(); // algunos navegadores solo lo permiten tras una pulsación; no pasa nada si falla
    }
  </script>
</body>
</html>

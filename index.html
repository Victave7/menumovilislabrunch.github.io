<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISLA — Brunch de día, Cócteles de noche · Elche</title>
<meta name="description" content="ISLA en Elche: brunch, matcha y café de especialidad de día — cócteles de autor y tardeo de noche. Elige tu momento.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#2D6A3F">
<link rel="canonical" href="https://islabrunchbar.com/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23FAF8F4'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='58' font-weight='700' text-anchor='middle' fill='%232D6A3F'%3EI%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --cream:      #FAF8F4;
  --bark:       #5C3D28;
  --day-1:      #FFF3E6;
  --day-2:      #FFE1CC;
  --day-3:      #FAF8F4;
  --day-text:   #3B2A1D;
  --day-accent: #2D6A3F;
  --day-gold:   #F0A857;
  --night-1:    #241A2E;
  --night-2:    #3B2A52;
  --night-3:    #1B1220;
  --night-text: #F5EFE6;
  --night-accent: #B79AE0;
  --night-gold: #E0A93B;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: 'Jost', sans-serif;
  background: var(--night-3);
  overflow-x: hidden;
}

a { text-decoration: none; color: inherit; }
button { font-family: inherit; }

.split {
  position: relative;
  display: flex;
  width: 100%;
  min-height: 100dvh;
}

.panel {
  position: relative;
  flex: 1 1 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8vh 6vw 12vh;
  overflow: hidden;
  transition: flex-grow 0.6s ease;
}

.panel-day {
  background: linear-gradient(200deg, var(--day-1) 0%, var(--day-2) 45%, var(--day-3) 100%);
  color: var(--day-text);
}
.panel-night {
  background: linear-gradient(200deg, var(--night-2) 0%, var(--night-1) 55%, var(--night-3) 100%);
  color: var(--night-text);
}

.panel-deco {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.panel-content {
  position: relative;
  z-index: 2;
  max-width: 260px;
  width: 100%;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.panel-eyebrow {
  font-size: clamp(10px, 2.4vw, 12px);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 500;
  opacity: 0.75;
  margin-bottom: 10px;
}
.panel-day .panel-eyebrow { color: var(--day-accent); }
.panel-night .panel-eyebrow { color: var(--night-accent); }

.panel-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-style: italic;
  font-size: clamp(30px, 9vw, 52px);
  line-height: 1.02;
  margin-bottom: 10px;
}

.panel-sub {
  font-size: clamp(11.5px, 2.6vw, 13.5px);
  line-height: 1.5;
  opacity: 0.86;
  margin-bottom: 22px;
}

.panel-cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 12px 20px;
  border-radius: 999px;
  font-size: clamp(11.5px, 2.6vw, 13px);
  font-weight: 500;
  letter-spacing: 0.2px;
  border: 1.5px solid currentColor;
  transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
}
.panel-day .panel-cta { color: var(--day-accent); }
.panel-night .panel-cta { color: var(--night-accent); }
.panel:hover .panel-cta,
.panel:focus-visible .panel-cta { transform: translateY(-2px); }
.panel-day:hover .panel-cta { background: var(--day-accent); color: var(--day-3); }
.panel-night:hover .panel-cta { background: var(--night-accent); color: var(--night-3); }

.panel-status {
  margin-top: 16px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.panel-status i {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
  animation: statusPulse 1.8s ease-in-out infinite;
}
@keyframes statusPulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }
  50% { opacity: 0.5; }
}
.panel-day .panel-status { color: var(--day-accent); }
.panel-night .panel-status { color: var(--night-gold); }

.split.now-day .panel-day .panel-status,
.split.now-night .panel-night .panel-status {
  opacity: 1;
  transform: translateY(0);
}
.split.now-day .panel-day { box-shadow: inset 0 0 0 2px rgba(45,106,63,0.18); }
.split.now-night .panel-night { box-shadow: inset 0 0 0 2px rgba(224,169,59,0.22); }

/* ── Decorative scenes ── */
.sun {
  position: absolute; top: 10%; right: 12%;
  width: 90px; height: 90px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FFE7B8, var(--day-gold) 70%);
  filter: blur(0.5px);
  opacity: 0.85;
}
.palm-silhouette { position: absolute; bottom: -6%; left: -8%; width: 60%; opacity: 0.9; }
.palm-silhouette.right { left: auto; right: -10%; bottom: -4%; width: 46%; transform: scaleX(-1); }

.moon {
  position: absolute; top: 9%; left: 14%;
  width: 64px; height: 64px; border-radius: 50%;
  background: radial-gradient(circle at 62% 38%, #FFFDF6, var(--night-gold) 78%);
  box-shadow: 0 0 30px rgba(224,169,59,0.35);
}
.stars { position: absolute; inset: 0; }
.stars i {
  position: absolute; width: 3px; height: 3px; border-radius: 50%;
  background: #F5EFE6; opacity: 0.7;
  animation: twinkle 3.2s ease-in-out infinite;
}
@keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
.glass-silhouette { position: absolute; bottom: -4%; right: -6%; width: 52%; opacity: 0.92; }

/* ── Seam ── */
.seam {
  position: absolute;
  top: 0; bottom: 0; left: 50%;
  width: 90px;
  transform: translateX(-50%);
  z-index: 3;
  pointer-events: none;
}
.seam svg { width: 100%; height: 100%; display: block; }

.seam-badge {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 76px; height: 76px;
  border-radius: 50%;
  background: var(--cream);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 26px rgba(0,0,0,0.35);
  z-index: 4;
  pointer-events: none;
}
.seam-badge svg { width: 46px; height: auto; }

/* ── Footer ── */
.foot {
  position: relative;
  z-index: 2;
  background: var(--night-3);
  color: var(--night-text);
  text-align: center;
  padding: 26px 20px 30px;
}
.foot-addr { font-size: 12.5px; opacity: 0.75; margin-bottom: 4px; }
.foot-social { font-size: 12.5px; opacity: 0.75; }
.foot-social a { text-decoration: underline; text-underline-offset: 2px; }

.lang-bar {
  display: flex; justify-content: center; gap: 6px;
  margin-top: 16px;
}
.lang-btn {
  background: transparent;
  border: 1px solid rgba(245,239,230,0.3);
  color: var(--night-text);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
  opacity: 0.75;
}
.lang-btn.on { opacity: 1; background: rgba(245,239,230,0.14); }
.lang-btn:focus-visible, .panel:focus-visible { outline: 2px solid var(--night-gold); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .panel-status i, .stars i { animation: none; }
}

@media (max-width: 360px) {
  .panel { padding: 7vh 4vw 10vh; }
  .seam { width: 60px; }
  .seam-badge { width: 60px; height: 60px; }
  .seam-badge svg { width: 36px; }
}
</style>
</head>
<body>

<div class="split" id="split">

  <!-- DÍA -->
  <a class="panel panel-day" href="https://islabrunchbar.com/menu" id="panelDay" aria-label="Ver el menú de brunch, matcha y café">
    <div class="panel-deco">
      <div class="sun"></div>
      <svg class="palm-silhouette" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M40,220 L48,90" stroke="#2D6A3F" stroke-width="6" fill="none" opacity="0.35"/>
        <path d="M44,100 C10,80 -10,40 4,0 C20,50 46,70 60,96 Z" fill="#2D6A3F" opacity="0.28"/>
        <path d="M44,100 C60,60 96,44 132,50 C96,66 74,84 60,102 Z" fill="#4A8A5A" opacity="0.28"/>
        <path d="M44,100 C30,54 40,10 76,-14 C58,26 52,60 56,100 Z" fill="#7FAE55" opacity="0.28"/>
        <path d="M44,100 C74,64 118,58 150,80 C112,80 82,90 60,106 Z" fill="#9CB33B" opacity="0.28"/>
      </svg>
    </div>
    <div class="panel-content">
      <p class="panel-eyebrow" data-en="By day" data-fr="Le jour">De día</p>
      <h1 class="panel-title" data-en="Brunch" data-fr="Brunch">Brunch</h1>
      <p class="panel-sub" data-en="Ceremonial matcha, ube and specialty coffee in the heart of Elche." data-fr="Matcha cérémoniel, ube et café de spécialité au cœur d'Elche.">Matcha ceremonial, ube y café de especialidad en el centro de Elche.</p>
      <span class="panel-cta" data-en="See the menu →" data-fr="Voir le menu →">Ver el menú →</span>
      <span class="panel-status"><i></i> <span data-en="Open now" data-fr="Ouvert maintenant">Abierto ahora</span></span>
    </div>
  </a>

  <!-- NOCHE -->
  <a class="panel panel-night" href="https://islabrunchbar.com/cocteleria" id="panelNight" aria-label="Ver la carta de cócteles y tardeo">
    <div class="panel-deco">
      <div class="moon"></div>
      <div class="stars">
        <i style="top:18%; left:60%; animation-delay:0s;"></i>
        <i style="top:28%; left:78%; animation-delay:0.6s;"></i>
        <i style="top:40%; left:50%; animation-delay:1.1s;"></i>
        <i style="top:14%; left:38%; animation-delay:1.6s;"></i>
        <i style="top:52%; left:70%; animation-delay:0.3s;"></i>
        <i style="top:34%; left:20%; animation-delay:2s;"></i>
      </div>
      <svg class="glass-silhouette" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M40,10 L160,10 L108,110 L108,190 L140,190 L140,206 L68,206 L68,190 L100,190 L100,110 Z" fill="#9B79C8" opacity="0.28"/>
        <circle cx="70" cy="46" r="10" fill="#E0A93B" opacity="0.4"/>
      </svg>
    </div>
    <div class="panel-content">
      <p class="panel-eyebrow" data-en="By night" data-fr="Le soir">De noche</p>
      <h1 class="panel-title" data-en="Cocktails" data-fr="Cocktails">Cócteles</h1>
      <p class="panel-sub" data-en="Signature cocktails and tardeo — ISLA transforms when the sun goes down." data-fr="Cocktails signature et tardeo — ISLA se transforme au coucher du soleil.">Cócteles de autor y tardeo — ISLA se transforma cuando cae el sol.</p>
      <span class="panel-cta" data-en="See the cocktail list →" data-fr="Voir la carte cocktails →">Ver la coctelería →</span>
      <span class="panel-status"><i></i> <span data-en="Open now" data-fr="Ouvert maintenant">Abierto ahora</span></span>
    </div>
  </a>

  <!-- Costura central -->
  <div class="seam" aria-hidden="true">
    <svg viewBox="0 0 90 900" preserveAspectRatio="none">
      <path d="M45,0 C25,60 65,120 45,180 C25,240 65,300 45,360 C25,420 65,480 45,540 C25,600 65,660 45,720 C25,780 65,840 45,900 L0,900 L0,0 Z" fill="var(--day-3)" opacity="0.55"/>
      <path d="M45,0 C25,60 65,120 45,180 C25,240 65,300 45,360 C25,420 65,480 45,540 C25,600 65,660 45,720 C25,780 65,840 45,900 L90,900 L90,0 Z" fill="var(--night-2)" opacity="0.55"/>
    </svg>
    <div class="seam-badge">
      <svg viewBox="0 0 240 90" xmlns="http://www.w3.org/2000/svg" aria-label="ISLA">
        <defs>
          <linearGradient id="islaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2D6A3F"/>
            <stop offset="55%" stop-color="#9CB33B"/>
            <stop offset="100%" stop-color="#6B4FA0"/>
          </linearGradient>
        </defs>
        <text x="50%" y="62" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="60" font-weight="600" letter-spacing="6" fill="url(#islaGrad)">ISLA</text>
      </svg>
    </div>
  </div>
</div>

<footer class="foot">
  <p class="foot-addr">C/ Nuestra Señora del Carmen 11 · Elche</p>
  <p class="foot-social"><a href="https://instagram.com/islabrunchbar" target="_blank" rel="noopener">@islabrunchbar</a></p>
  <div class="lang-bar" role="group" aria-label="Idioma · Language · Langue">
    <button class="lang-btn on" data-lang="es" onclick="setLang('es',this)">ES</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en',this)">EN</button>
    <button class="lang-btn" data-lang="fr" onclick="setLang('fr',this)">FR</button>
  </div>
</footer>

<script>
// ══════════ Franja horaria día / noche ══════════
// Ajusta estas dos horas a tu horario real de cambio de turno.
const DAY_START = 7;    // a partir de esta hora se resalta "Brunch"
const NIGHT_START = 17; // a partir de esta hora se resalta "Cócteles"

(function () {
  const hour = new Date().getHours();
  const isNight = hour >= NIGHT_START || hour < DAY_START;
  document.getElementById('split').classList.add(isNight ? 'now-night' : 'now-day');
})();

// ══════════ Idioma ES / EN / FR (mismo patrón que la carta) ══════════
const SUPPORTED_LANGS = ['es', 'en', 'fr'];

function initI18n() {
  document.querySelectorAll('[data-en], [data-fr]').forEach(el => {
    el.setAttribute('data-es', el.textContent);
  });
}

function detectLang() {
  const raw = (navigator.language || 'es').slice(0, 2).toLowerCase();
  return SUPPORTED_LANGS.includes(raw) ? raw : 'es';
}

function setLang(lang, btn) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('on'));
  const activeBtn = btn || document.querySelector('.lang-btn[data-lang="' + lang + '"]');
  if (activeBtn) activeBtn.classList.add('on');
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-en], [data-fr]').forEach(el => {
    const val = el.getAttribute('data-' + lang) || el.getAttribute('data-es');
    if (val !== null) el.textContent = val;
  });
}

initI18n();
setLang(detectLang());
</script>
</body>
</html>
